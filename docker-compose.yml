services:
  eiskarte:
    build: .
    ports:
      - "3001:3001"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - PORT=3001
    volumes:
      - eiskarte-data:/app/server/data
      - eiskarte-uploads:/app/server/uploads
    restart: unless-stopped

volumes:
  eiskarte-data:
  eiskarte-uploads:
